<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple modern authentication interface.">
  <title>DAPA — Sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="auth-card" aria-label="Authentication">
      <div class="brand-mark" aria-hidden="true">
        <img src="/images/photo.svg" alt="DAPA logo">
      </div>
      <div class="heading">
        <h1 id="title">Welcome back</h1>
        <p id="subtitle">Sign in to continue to your account.</p>
      </div>
      <div class="tabs" role="tablist" aria-label="Authentication mode">
        <button type="button" class="active" id="loginTab" role="tab" aria-selected="true">Sign in</button>
        <button type="button" id="registerTab" role="tab" aria-selected="false">Register</button>
      </div>
      <form id="authForm">
        <label class="field hidden" id="nameField">
          <span>Name</span>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
            <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name">
          </div>
        </label>
        <label class="field">
          <span>Email</span>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </label>
        <label class="field">
          <span>Password</span>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
            <button type="button" class="show-button" id="showPassword">Show</button>
          </div>
        </label>
        <div class="form-row" id="loginOptions">
          <label class="remember"><input type="checkbox"> <span>Remember me</span></label>
          <button type="button" class="text-button" id="forgot">Forgot password?</button>
        </div>
        <button class="submit-button" type="submit" id="submitButton">Sign in</button>
      </form>
      <p class="status hidden" id="status" role="status"></p>
      <p class="footer-note">By continuing, you agree to the terms and privacy policy.</p>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
